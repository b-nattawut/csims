<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | CSIMS</title>
    <style>
		
		@font-face {
            font-family: 'Sarabun';
            src: url('fonts/Sarabun/Sarabun-Regular.ttf') format('truetype');
        }
		
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #080c14;
            --surface: #0e1420;
            --surface2: #131926;
            --accent: #00d4ff;
            --accent2: #0057ff;
            --danger: #ff4d6d;
            --text: #e8edf5;
            --text-muted: #6b7a99;
            --border: rgba(0, 212, 255, 0.12);
            --glow: rgba(0, 212, 255, 0.25);
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* === BACKGROUND GRID === */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* === GLOW ORBS === */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }
        .orb-1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0,87,255,0.18) 0%, transparent 70%);
            top: -150px; left: -150px;
            animation: driftA 12s ease-in-out infinite alternate;
        }
        .orb-2 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(0,212,255,0.12) 0%, transparent 70%);
            bottom: -100px; right: -100px;
            animation: driftB 15s ease-in-out infinite alternate;
        }
        .orb-3 {
            width: 250px; height: 250px;
            background: radial-gradient(circle, rgba(255,77,109,0.08) 0%, transparent 70%);
            top: 50%; left: 60%;
            animation: driftC 18s ease-in-out infinite alternate;
        }

        @keyframes driftA { from { transform: translate(0,0); } to { transform: translate(60px, 40px); } }
        @keyframes driftB { from { transform: translate(0,0); } to { transform: translate(-50px, -30px); } }
        @keyframes driftC { from { transform: translate(0,0); } to { transform: translate(-40px, 50px); } }

        /* === SCAN LINE === */
        .scanline {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 3px,
                rgba(0,0,0,0.04) 3px,
                rgba(0,0,0,0.04) 4px
            );
            pointer-events: none;
            z-index: 1;
        }

        /* === MAIN CARD === */
        .card {
            position: relative;
            z-index: 10;
            width: 460px;
            max-width: 95vw;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px 44px;
            box-shadow:
                0 0 0 1px rgba(0,212,255,0.06),
                0 40px 80px rgba(0,0,0,0.6),
                0 0 60px rgba(0,87,255,0.08);
            animation: cardIn 0.7s cubic-bezier(0.22,1,0.36,1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* === CORNER ACCENTS === */
        .card::before, .card::after {
            content: '';
            position: absolute;
            width: 24px; height: 24px;
            border-color: var(--accent);
            border-style: solid;
        }
        .card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-radius: 20px 0 0 0; }
        .card::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-radius: 0 0 20px 0; }

        /* === HEADER === */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeUp 0.6s 0.15s both;
        }

        .icon-ring {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, rgba(0,212,255,0.15), rgba(0,87,255,0.05));
            border: 1px solid rgba(0,212,255,0.3);
            margin-bottom: 20px;
            position: relative;
            box-shadow: 0 0 30px rgba(0,212,255,0.15);
        }

        .icon-ring::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1px solid rgba(0,212,255,0.1);
            animation: spinRing 8s linear infinite;
            border-top-color: rgba(0,212,255,0.4);
        }

        @keyframes spinRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .fingerprint-svg {
            width: 38px;
            height: 38px;
            color: var(--accent);
            filter: drop-shadow(0 0 8px rgba(0,212,255,0.5));
        }

        .system-name {
            font-family: 'Space Mono', monospace;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            opacity: 0.85;
            margin-bottom: 6px;
        }

        .system-full {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            line-height: 1.5;
        }

        /* === TEST MODE BADGE === */
        .test-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 4px 14px;
            border-radius: 20px;
            background: rgba(255,193,7,0.1);
            border: 1px solid rgba(255,193,7,0.3);
            font-size: 11px;
            font-weight: 700;
            color: #ffc107;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .test-badge::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #ffc107;
            animation: pulse 1.5s infinite;
        }

        /* === DIVIDER === */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
            margin-bottom: 32px;
        }

        /* === FORM === */
        .form-group {
            margin-bottom: 22px;
            animation: fadeUp 0.6s both;
        }
        .form-group:nth-child(1) { animation-delay: 0.25s; }
        .form-group:nth-child(2) { animation-delay: 0.32s; }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        label svg {
            width: 14px; height: 14px;
            color: var(--accent);
            opacity: 0.7;
        }

        .input-wrap {
            position: relative;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            background: var(--surface2);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 10px;
            padding: 14px 18px;
            font-family: 'Sarabun', sans-serif;
            font-size: 15px;
            color: var(--text);
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        input::placeholder { color: var(--text-muted); opacity: 0.5; }

        input:focus {
            border-color: rgba(0,212,255,0.4);
            box-shadow: 0 0 0 3px rgba(0,212,255,0.08), inset 0 0 20px rgba(0,212,255,0.03);
        }

        /* === BUTTON === */
        .btn-login {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #0057ff 0%, #00b4d8 100%);
            color: #fff;
            font-family: 'Sarabun', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 24px rgba(0,87,255,0.35);
            animation: fadeUp 0.6s 0.4s both;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s;
        }

        .btn-login:hover::before { left: 100%; }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0,87,255,0.5);
        }

        .btn-login:active { transform: translateY(0); }

        .btn-icon {
            margin-right: 8px;
        }

        /* === FOOTER LINKS === */
        .footer-links {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
            animation: fadeUp 0.6s 0.5s both;
        }

        .footer-links a {
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .footer-links a:hover { color: var(--accent); }

        .footer-links svg {
            width: 13px; height: 13px;
        }

        /* === NOTICE === */
        .notice {
            margin-top: 28px;
            padding: 12px 16px;
            border-radius: 8px;
            background: rgba(0,212,255,0.04);
            border: 1px solid rgba(0,212,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-muted);
            animation: fadeUp 0.6s 0.55s both;
        }

        .notice svg {
            width: 14px; height: 14px;
            color: var(--accent);
            flex-shrink: 0;
            opacity: 0.7;
        }

        /* === ERROR === */
        .error-msg {
            color: var(--danger);
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<div class="scanline"></div>

<div class="card">

    <div class="header">
        <div class="icon-ring">
            <!-- Fingerprint SVG -->
            <svg class="fingerprint-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1C6.48 1 2 5.48 2 11c0 3.04 1.36 5.77 3.52 7.63"/>
                <path d="M12 5c-3.31 0-6 2.69-6 6 0 1.77.77 3.37 2 4.47"/>
                <path d="M12 9c-1.1 0-2 .9-2 2 0 .74.41 1.38 1 1.73"/>
                <path d="M12 9c1.1 0 2 .9 2 2 0 1.35-.8 2.51-1.96 3.04"/>
                <path d="M12 13c0 2.21-1.79 4-4 4"/>
                <path d="M12 1c5.52 0 10 4.48 10 10 0 3.04-1.36 5.77-3.52 7.63"/>
                <path d="M16.83 17.5C18.17 16.07 19 14.13 19 12"/>
            </svg>
        </div>
        <div class="system-name">CSIMS</div>
        <div class="system-full">Crime Scene Information Management System</div>
        
    </div>

    <div class="divider"></div>

    <form id="loginForm">
        <div class="form-group">
            <label>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                อีเมลผู้ใช้งาน
            </label>
            <div class="input-wrap">
                <input type="email" id="email" placeholder="กรอกอีเมลของคุณ" required autocomplete="off">
            </div>
        </div>

        <div class="form-group">
            <label>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                รหัสผ่าน
            </label>
            <div class="input-wrap">
                <input type="password" id="password" placeholder="กรอกรหัสผ่านของคุณ" required>
            </div>
        </div>

        <button type="submit" class="btn-login">
             เข้าสู่ระบบ
        </button>
    </form>

    <div id="errorMessage" class="error-msg"></div>

    <div class="footer-links">
        <a href="register.php">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            ลงทะเบียน
        </a>
        <a href="forget_password.php">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            ลืมรหัสผ่าน?
        </a>
    </div>

    <div class="notice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        ระบบนี้ใช้สำหรับบุคลากรที่ได้รับอนุญาตเท่านั้น
    </div>

</div>

<script>
    // รีเซ็ตฟอร์มเมื่อกด back กลับมา (bfcache)
    window.addEventListener('pageshow', function(event) {
        const btn = document.querySelector('.btn-login');
        btn.textContent = '→ เข้าสู่ระบบ';
        btn.disabled = false;
        btn.style.background = '';
        document.getElementById('loginForm').reset();
        document.getElementById('errorMessage').innerText = '';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById('errorMessage');
        errorEl.innerText = '';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.querySelector('.btn-login');

        btn.textContent = '⟳  กำลังตรวจสอบ...';
        btn.disabled = true;

        try {
            // Step 1: ตรวจ email + password
            const loginRes = await fetch('api/login_otp.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const loginData = await loginRes.json();

            if (!loginData.success) {
                errorEl.innerText = '⚠ ' + loginData.message;
                btn.textContent = '→ เข้าสู่ระบบ';
                btn.disabled = false;
                return;
            }

            // Step 2: Login สำเร็จ → ส่ง OTP ไปอีเมล
            btn.textContent = '✉  กำลังส่ง OTP...';

            const otpRes = await fetch('api/send_otp.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: loginData.user_id,
                    email: loginData.email
                })
            });
            const otpData = await otpRes.json();

            if (!otpData.success) {
                errorEl.innerText = '⚠ ' + otpData.message;
                btn.textContent = '→ เข้าสู่ระบบ';
                btn.disabled = false;
                return;
            }

            // Step 3: สำเร็จ → redirect ไป verify_otp.html
            btn.textContent = '✓  ส่ง OTP สำเร็จ — กำลังไปหน้ายืนยัน...';
            btn.style.background = 'linear-gradient(135deg, #06d6a0, #0096c7)';

            // เก็บ user_id / email / test_otp ใน sessionStorage
            sessionStorage.setItem('otp_user_id', loginData.user_id);
            sessionStorage.setItem('otp_email', loginData.email);
            if (otpData.test_otp) {
                sessionStorage.setItem('test_otp', otpData.test_otp);
            }
            if (otpData.masked_email) {
                sessionStorage.setItem('otp_masked_email', otpData.masked_email);
            }

            setTimeout(() => {
                window.location.href = 'verify_otp.html';
            }, 1000);

        } catch (err) {
            errorEl.innerText = '⚠ เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์';
            btn.textContent = '→ เข้าสู่ระบบ';
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
